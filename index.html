<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Love & War</title>

    <meta property="og:title" content="Love & War">
    <meta property="og:description" content="">
    <meta property="og:image" content="https://raw.githubusercontent.com/yasirtahir493-design/sturdy-waffle/main/4.jpg">
    <meta property="og:type" content="website">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f0f0f;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .gallery-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 1100px;
        }

        .video-card {
            position: relative;
            display: block;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 16 / 9;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            background-color: #222;
            cursor: pointer;
        }

        .video-thumbnail {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease, filter 0.4s ease;
        }

        .play-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.2);
            transition: background 0.3s ease;
        }

        .play-button {
            width: 65px;
            height: 65px;
            background: rgba(255,255,255,0.9);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.3s ease, background-color 0.3s ease;
        }

        .play-icon {
            width: 0;
            height: 0;
            border-top: 12px solid transparent;
            border-bottom: 12px solid transparent;
            border-left: 20px solid #111;
            margin-left: 5px;
        }

        .video-card:hover .video-thumbnail {
            transform: scale(1.05);
            filter: brightness(0.85);
        }

        .video-card:hover .play-overlay {
            background: rgba(0,0,0,0.4);
        }

        .video-card:hover .play-button {
            transform: scale(1.15);
            background: #ff0000;
        }

        .video-card:hover .play-icon {
            border-left-color: #fff;
        }
    </style>
</head>

<body>
    <div class="gallery-container">

        <!-- Image 1 -->
        <a href="https://monstroustouchy.com/aed9bf7t86?key=786651f98288fdf59139a4f56ae4606c" class="video-card">
            <img src="https://raw.githubusercontent.com/pabgysanfq-wq/dffsfa/f0db3cb5fea5a913bf6a6cdc56aa13cd89154bae/morning-sex-14.gif"
            alt="Video 1" class="video-thumbnail">

            <div class="play-overlay">
                <div class="play-button">
                    <div class="play-icon"></div>
                </div>
            </div>
        </a>

        <!-- Image 2 -->
        <a href="https://monstroustouchy.com/aed9bf7t86?key=786651f98288fdf59139a4f56ae4606c" class="video-card">
            <img src="https://raw.githubusercontent.com/pabgysanfq-wq/yeryr/e8d572d2e87e7258f13a4b61a4de757b7d7339e4/morning-sex-40.gif"
            alt="Video 2" class="video-thumbnail">

            <div class="play-overlay">
                <div class="play-button">
                    <div class="play-icon"></div>
                </div>
            </div>
        </a>

        <!-- Image 3 -->
        <a href="https://monstroustouchy.com/aed9bf7t86?key=786651f98288fdf59139a4f56ae4606c" class="video-card">
            <img src="https://ghgj-dqx.pages.dev/577887f5354b81c4af9365ebb225ca04.gif"
            alt="Video 3" class="video-thumbnail">

            <div class="play-overlay">
                <div class="play-button">
                    <div class="play-icon"></div>
                </div>
            </div>
        </a>

    </div>
</body>
</html>
